<DOCTYPE html>
<html lan"en">
<head>
	<title>html.form:</title>
	<meta charset="UTF.8">
</head>
<body style="color:Black">
<form action=""method="post">
<fieldset style="Background:Yellow;width:600px;">
		<legend>Personal Info:</legend>
	<table>
		<tr>
			<td><label>firstname:</label></td>
			<td><input type="text" name="Iname" placeholder="enter your name"></td>
		</tr>
		<tr>
			<td><label>surname:</label></td>
			<td><input type="text"name="fname"></td>
		</tr>
		<tr>
			<td><label>Fathername:</label></td>
			<td><input type="text"name="sname"></td>
		</tr>
		<tr>
			<td><label>gender:</label></td>
			<td>
				<input type="radio" name="gender">Male
				<input type="radio" name="gender">Female
			</td>
		</tr>
		<tr>
			<td><label>date of birth:</label></td>
			<td>
				<select>
					<option value="">-Date-</option>
					<option value="1">1</option>
					<option value="2">2</option>
					<option value="3">3</option>
					<option value="4">4</option>
					<option value="5">5</option>
					<option value="6">6</option>
					<option value="7">7</option>
					<option value="8">8</option>
					<option value="9">9</option>
					<option value="10">10</option>
					<option value="11"selected>11</option>
				</select>
				<select>
					<option value="">-Month-</option>
					<option value="Jan"selected>jan</option>
					<option value="Feb">Feb</option>
					<option value="Mar">Mar</option>
					<option value="Apr">Apr</option>
					<option value="May">May</option>
					<option value="Jun">jun</option>
					<option value="July">july</option>
					<option value="Aug">Aug</option>
					<option value="Sep">Sep</option>
					<option value="Oct">Oct</option>
					<option value="Nov">Nov</option>
					<option value="Dec">Dec</option>
				</select>
				<select>
					<option value="">-Year-</option>
					<option value="2000">2000</option>
					<option value="2001"selected>2001</option>
					<option value="2002">2002</option>
					<option value="2003">2003</option>
					<option value="2004">2004</option>
					<option value="2005">2005</option>
					<option value="2006">2006</option>
					<option value="2007">2007</option>
					<option value="2008">2008</option>
					<option value="2009">2009</option>
					<option value="2010">2010</option>
				</select>
				
			</td>
		</tr>
		<tr>
			<td><label>course:</label></td>
			<td>
				<select>
					<option value="">--select---</option>
					<option value="B.sc">B.sc</option>
					<option value="B.tech"selected>B.tech</option>
					<option value="B.com">B.com</option>
					<option value="B.pharmacy">B.pharmacy</option>
				</select>
				<select>
					<option value="">--select--</option>
					<option value="Ece">Ece</option>
					<option value="Cse" Selected>Cse</option>
					<option value="EEE">EEE</option>
					<option value="IT">IT</option>
				</select>
			</td>
		</tr>
		<tr>
			<td><label>address:</label></td>
			<td>
				<textarea rows="5" cols="25"></textarea>
			</td>
		</tr>
		<tr>
			<td><label>Phone number:</label></td>
			<td><input type="text" name="ename" placeholder="enter your number"></td>
		</tr>
		<tr>
			<td><label>photo upload:</label></td>
			<td><input type="file" name="file" placeholder="upload your photo">
			<input type="submit" name="upload">
			</td>
		</tr>
		<tr>
			<td><label>Technical:</label></td>
			<td><input type="checkbox">c<br><input type="checkbox">c++<br><input type="checkbox">java<br><input type="checkbox">oracle<br><input type="checkbox">Html<br><input type="checkbox">others<br></td>
		</tr>
		<tr>
			<td></td>
			<td>
				<input type="submit" value="login">
				<input type="reset" value="clear">
			</td>
		</tr>
</form>
</body>
</html>
