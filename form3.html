<!DOCTYPE html>
<html lan"en">
<head>
	<title>html.form:</title>
	<meta charset="UTF.8">
</head>
<body> 
<h2 style="Background:Red;color:White;Text-align:left">JobSearch.com</h2>
<form action=""method="post">
<h3 style="Background:White;color:Black;Text-align:left">Create Your Account</h3>
<h3 style="Background:White;color:Red;Text-align:left">*Required Field</h3>
<h3 style="Background:silver;color:Black;Text-align:left">Basic Information</h3>
<table>
		<tr>
			<td></td>
			<td></td>
			<td><label>Email<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Password<span style="color:red">*</span></label></td>
			<td><input type="Password" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Reset password<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>First name<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Last name<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Phone Number<span style="color:red">*</span></label></td>
			<td><input type="Tel" name="number" placeholder="000-000-0000" Required Minlength="10" Maxlength="10"></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Address<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>City<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Pincode<span style="color:red">*</span></label></td>
			<td><input type="text" name="number" placeholder="000000" Required minlength="6" maxlength="6"></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>country<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
</table>
		<h3 style="Background:silver;color:Black;Text-align:left">Education</h3>
<table>
		<tr>
			<td></td>
			<td></td>
			<td><label>School<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Pass year<span style="color:red">*</span></label></td>
			<td><input type="text" name="Iname" Required></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Education level<span style="color:red">*</span></label></td>
			<td>
				<select name="Iname" Required>
				<option value="Select">-Select-</option>
					<option value="UG">UG</option>
					<option value="PG">PG</option>
					<option value="Fresher">Fresher</option>
				</select>
			</td>
		</tr>
		</table>
		<table>
		<tr>
		<td></td>
		<td></td>
		<td></td>
		<td><fieldset>
				<legend>Education Status</legend>
				<input type="checkbox">Graduated<br>
				<input type="checkbox">Current Employee<br>
				<input type="checkbox">Did Not Graduate<br>
		</td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Graduation date</label></td>
			<td><input type="text" name="Iname"></td>
		</tr>
		</table>
		<h4 style="Background:silver;color:Black;Text-align:left">Work Experience</h4>
<table>
		<tr>
			<td></td>
			<td></td>
			<td><label>Employer</label></td>
			<td><input type="text" name="Iname"></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Job Title</label></td>
			<td><input type="text" name="Iname"></td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Job Address</label></td>
			<td>
				<textarea rows="5" cols="25"></textarea>
			</td>
		</tr>
		<tr>
			<td></td>
			<td></td>
			<td><label>Worked Year</label></td>
			<td><input type="text" name="Iname"></td>
		</tr>
</table>
		<h3 style="Background:silver;color:Black;Text-align:left">Attachments</h3>
<table>
		<tr>
			<td><label>Attachment</label></td>
			<td><input type="file" name="file"></td>
		</tr>
		<tr>
		<td></td>
			<td>
				<input style="Background:red;color:white" type="reset" value="clear">
				<input style="Background:red;color:white" type="submit" value="apply">
			</td>
		</tr>
</table>
</form>
</body>
</html>
